<!DOCTYPE html>
<html lang="zh-Hant" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- SEO & PWA -->
    <title>ICT 歷年 MC 試題庫</title>
    <meta name="description" content="最強 DSE ICT 歷年 MC 試題庫。支援即時練習、模擬考試與自訂組卷。">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ICT MC">
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <meta name="theme-color" content="#141414">
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Geist', 'Noto Sans TC', 'system-ui', 'sans-serif']
                    },
                    colors: {
                        ledger: {
                            ground: '#f4f6f8',
                            surface: '#ffffff',
                            border: '#e6e6e6',
                            rule: '#f0f0f0',
                            control: '#d4d4d4',
                            text: '#0a0a0a',
                            muted: '#525252',
                            accent: '#141414',
                            data: '#1d5fbf'
                        }
                    }
                }
            }
        };
    </script>
    
    <!-- Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="css/app.css">
</head>

<body class="bg-[#f4f6f8] text-[#0a0a0a] min-h-screen flex flex-col pb-20 xl:pb-8 select-none">

    <!-- Header Navigation (Achromatic Ledger Bar) -->
    <header class="sticky top-0 inset-x-0 z-40 ledger-header pt-[env(safe-area-inset-top)] h-[calc(3.75rem+env(safe-area-inset-top))]">
        <div class="max-w-[1450px] mx-auto px-4 sm:px-6 h-full flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer group" onclick="window.scrollTo({top:0, behavior:'smooth'})">
                <div class="w-8 h-8 rounded bg-[#141414] text-white flex items-center justify-center font-bold text-xs">
                    ICT
                </div>
                <h1 class="font-bold text-base sm:text-lg tracking-tight leading-none text-[#0a0a0a]">ICT 歷年 MC 試題庫</h1>
            </div>

            <div class="flex items-center gap-4">
                <div class="flex flex-col items-end mr-1">
                    <span class="text-xs text-[#525252] font-semibold tracking-wider">目前得分</span>
                    <div class="flex items-center gap-1.5 num">
                        <span id="header-score" class="font-bold text-[#0a0a0a] text-lg leading-none">0</span>
                        <span class="text-xs text-[#525252] font-semibold">/ <span id="header-total">0</span></span>
                    </div>
                </div>
                <div class="h-5 w-px bg-[#e6e6e6]"></div>
                <button onclick="UI.toggleModal('history-modal', true)" class="w-8 h-8 rounded border border-[#d4d4d4] bg-white hover:bg-[#eeeeee] text-[#0a0a0a] flex items-center justify-center transition-colors" title="歷史紀錄" aria-label="歷史紀錄">
                    <i class="fas fa-history text-xs"></i>
                </button>
            </div>
        </div>
        <div class="absolute bottom-0 left-0 w-full h-[2px] bg-[#f0f0f0]">
            <div id="progress-bar" class="h-full bg-[#1d5fbf] transition-[width] duration-300 w-0"></div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-[1450px] mx-auto w-full px-4 sm:px-6 pt-4 sm:pt-6 flex flex-col xl:flex-row gap-5">
        
        <!-- Desktop Sidebar -->
        <aside class="hidden xl:flex flex-col w-72 flex-shrink-0">
            <div class="sticky top-[calc(4.5rem+env(safe-area-inset-top))] space-y-3.5 max-h-[calc(100vh-6rem)] flex flex-col">
                <!-- Stats Card -->
                <div class="ledger-panel p-4 flex-shrink-0">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs font-semibold text-[#525252]">計時器</span>
                        <span id="timer-display" class="num font-semibold text-[#0a0a0a] bg-[#f4f6f8] px-2.5 py-0.5 rounded border border-[#e6e6e6] text-xs">00:00</span>
                    </div>
                    <div>
                        <div class="text-xs text-[#525252] font-medium mb-0.5">已作答題數</div>
                        <div class="flex items-baseline gap-1 num">
                            <span id="sidebar-score" class="text-2xl font-bold text-[#0a0a0a]">0</span>
                            <span class="text-[#525252] font-semibold text-xs">/ <span id="sidebar-total">0</span></span>
                        </div>
                    </div>
                    <div class="mt-3 pt-2.5 border-t border-[#f0f0f0] flex justify-between items-center text-xs">
                        <div class="flex items-center gap-1.5 text-[#247b50] font-semibold">
                            <i class="fas fa-check-circle text-xs"></i>
                            <span>題庫就緒</span>
                        </div>
                        <button onclick="UI.toggleModal('history-modal', true)" class="font-semibold text-[#0a0a0a] hover:underline">
                            歷史紀錄
                        </button>
                    </div>
                </div>

                <!-- Navigation Card -->
                <div class="ledger-panel p-4 flex-1 flex flex-col min-h-0">
                    <div class="flex justify-between items-center mb-2.5 flex-shrink-0">
                        <h2 class="text-xs font-bold text-[#525252] flex items-center gap-1.5">
                            <i class="fas fa-th-large text-xs text-[#0a0a0a]"></i> 題目快速導覽
                        </h2>
                    </div>
                    <div class="overflow-y-auto custom-scroll pr-1 flex-1">
                        <div id="question-nav-grid" class="grid grid-cols-5 gap-1.5 pb-2"></div>
                    </div>
                    <div class="mt-2.5 pt-2 border-t border-[#f0f0f0] text-xs text-[#525252] flex items-center justify-between">
                        <span>快速鍵</span>
                        <span class="num text-[11px]">J / K 換題 · 1-4 作答</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Center Main Content -->
        <div class="flex-1 min-w-0">
            <!-- Filter & Mode Bar -->
            <div class="ledger-panel p-3.5 sm:p-4 mb-4 relative z-30">
                <div class="grid grid-cols-1 md:grid-cols-12 gap-3 mb-3.5">
                    
                    <!-- Year / Paper Selection -->
                    <div class="md:col-span-4 flex flex-col gap-1">
                        <div class="flex justify-between items-baseline">
                            <label for="examyear" class="text-xs font-semibold text-[#525252]">年份 / 試卷</label>
                            <button onclick="UI.toggleModal('custom-exam-modal', true)" class="text-xs font-semibold text-[#0a0a0a] hover:underline transition-colors flex items-center gap-1">
                                自訂組卷
                            </button>
                        </div>
                        <div class="relative">
                            <select id="examyear" class="w-full pl-3 pr-8 py-2 rounded-md border border-[#d4d4d4] bg-white text-sm font-semibold focus:border-[#1d5fbf] focus:ring-1 focus:ring-[#1d5fbf] outline-none cursor-pointer text-[#0a0a0a] appearance-none"></select>
                            <i class="fas fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-[#525252] text-xs pointer-events-none"></i>
                        </div>
                    </div>

                    <!-- Mode Selection -->
                    <div class="md:col-span-4 flex flex-col gap-1">
                        <label for="mode" class="text-xs font-semibold text-[#525252]">練習模式</label>
                        <div class="relative">
                            <select id="mode" class="w-full pl-3 pr-8 py-2 rounded-md border border-[#d4d4d4] bg-white text-sm font-semibold focus:border-[#1d5fbf] focus:ring-1 focus:ring-[#1d5fbf] outline-none cursor-pointer text-[#0a0a0a] appearance-none">
                                <option value="practice">練習模式 (即時對答案)</option>
                                <option value="exam">考試模式 (模擬 DSE 計時)</option>
                                <option value="study">溫習模式 (直接看答案)</option>
                            </select>
                            <i class="fas fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-[#525252] text-xs pointer-events-none"></i>
                        </div>
                    </div>

                    <!-- Search Input -->
                    <div class="md:col-span-4 flex flex-col gap-1">
                        <label for="search-input" class="text-xs font-semibold text-[#525252]">搜尋題號 / 關鍵字</label>
                        <div class="relative">
                            <input type="text" id="search-input" placeholder="輸入題號 (如 5、12)..." class="w-full pl-8 pr-3 py-2 rounded-md border border-[#d4d4d4] bg-white text-sm font-semibold focus:border-[#1d5fbf] focus:ring-1 focus:ring-[#1d5fbf] outline-none text-[#0a0a0a] placeholder-[#6b6b6b]">
                            <i class="fas fa-search absolute left-2.5 top-1/2 -translate-y-1/2 text-[#525252] text-xs"></i>
                        </div>
                        <div class="flex items-center justify-between text-xs text-[#525252] mt-1 px-0.5">
                            <span id="search-stats-text" class="font-medium"></span>
                            <label class="cursor-pointer inline-flex items-center gap-1 font-semibold hover:text-[#0a0a0a] transition-colors">
                                <input type="checkbox" id="search-scope-all" class="w-3.5 h-3.5 rounded text-[#141414] focus:ring-[#141414] cursor-pointer" onchange="UI.toggleSearchScope(this.checked)">
                                <span id="search-scope-label">跨年份全庫搜尋 (835題)</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Segmented Control Tabs (Achromatic Ledger Pill Tabs) -->
                <div class="bg-[#eeeeee] p-1 rounded-md flex gap-1 border border-[#e6e6e6]">
                    <button onclick="UI.setTab('all')" id="tab-all" class="flex-1 py-1.5 px-3 rounded text-xs sm:text-sm font-bold text-center whitespace-nowrap bg-white text-[#0a0a0a] border border-[#d4d4d4] flex items-center justify-center gap-1.5 transition-colors">
                        <span>所有題目</span>
                        <span id="tab-count-all" class="num text-xs px-1.5 py-0.2 bg-[#eeeeee] text-[#0a0a0a] rounded">0</span>
                    </button>
                    <button onclick="UI.setTab('wrong')" id="tab-wrong" class="flex-1 py-1.5 px-3 rounded text-xs sm:text-sm font-medium text-center whitespace-nowrap text-[#525252] hover:text-[#0a0a0a] flex items-center justify-center gap-1.5 transition-colors">
                        <span>錯題重溫</span>
                        <span id="tab-count-wrong" class="num text-xs px-1.5 py-0.2 bg-[#ffedea] text-[#831c1e] font-bold rounded">0</span>
                    </button>
                    <button onclick="UI.setTab('starred')" id="tab-starred" class="flex-1 py-1.5 px-3 rounded text-xs sm:text-sm font-medium text-center whitespace-nowrap text-[#525252] hover:text-[#0a0a0a] flex items-center justify-center gap-1.5 transition-colors">
                        <span>星號收藏</span>
                        <span id="tab-count-starred" class="num text-xs px-1.5 py-0.2 bg-[#fffbeb] text-[#92400e] font-bold rounded">0</span>
                    </button>
                </div>
            </div>

            <!-- Question Cards Container -->
            <div id="result" class="space-y-3.5 min-h-[50vh] select-auto">
                <!-- Skeleton Loader -->
                <div class="ledger-panel p-5">
                    <div class="flex justify-between mb-4">
                        <div class="h-4 bg-[#eeeeee] rounded w-20"></div>
                        <div class="h-4 bg-[#eeeeee] rounded w-8"></div>
                    </div>
                    <div class="h-24 bg-[#f4f6f8] rounded w-4/5 mb-4 border border-[#e6e6e6]"></div>
                    <div class="space-y-2">
                        <div class="h-11 bg-[#f4f6f8] rounded border border-[#e6e6e6] w-full"></div>
                        <div class="h-11 bg-[#f4f6f8] rounded border border-[#e6e6e6] w-full"></div>
                        <div class="h-11 bg-[#f4f6f8] rounded border border-[#e6e6e6] w-full"></div>
                        <div class="h-11 bg-[#f4f6f8] rounded border border-[#e6e6e6] w-full"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <nav id="mobile-bottom-bar" class="xl:hidden fixed bottom-0 inset-x-0 bg-white border-t border-[#e6e6e6] z-50 pb-safe">
        <div class="flex items-center justify-around h-14 px-2">
            <button onclick="UI.toggleMobileNav(true)" class="mobile-tab-btn flex flex-col items-center justify-center gap-0.5 w-16 h-full text-[#525252] hover:text-[#0a0a0a] transition-transform">
                <i class="fas fa-th-large text-sm"></i>
                <span class="text-xs font-semibold">題號導覽</span>
            </button>
            <button onclick="UI.setTab('wrong'); window.scrollTo({top:0, behavior:'smooth'})" class="mobile-tab-btn flex flex-col items-center justify-center gap-0.5 w-16 h-full text-[#525252] hover:text-[#0a0a0a] transition-transform">
                <i class="fas fa-times-circle text-sm text-[#c4242a]"></i>
                <span class="text-xs font-semibold">錯題重溫</span>
            </button>
            <button onclick="UI.setTab('starred'); window.scrollTo({top:0, behavior:'smooth'})" class="mobile-tab-btn flex flex-col items-center justify-center gap-0.5 w-16 h-full text-[#525252] hover:text-[#0a0a0a] transition-transform">
                <i class="fas fa-star text-sm text-[#92400e]"></i>
                <span class="text-xs font-semibold">星號收藏</span>
            </button>
            <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="mobile-tab-btn flex flex-col items-center justify-center gap-0.5 w-16 h-full text-[#525252] hover:text-[#0a0a0a] transition-transform">
                <i class="fas fa-arrow-up text-sm"></i>
                <span class="text-xs font-semibold">頂部</span>
            </button>
            <button id="mobile-submit-btn" onclick="Quiz.submitExam()" class="mobile-tab-btn hidden flex-col items-center justify-center gap-0.5 w-16 h-full text-[#141414] transition-transform font-bold">
                <i class="fas fa-check-circle text-base text-[#1d5fbf]"></i>
                <span class="text-xs font-bold">交卷</span>
            </button>
        </div>
    </nav>

    <!-- Mobile Drawer for Question Navigation -->
    <div id="mobile-nav-drawer" class="fixed inset-0 z-[60] hidden" aria-hidden="true">
        <div class="absolute inset-0 bg-[#0a0a0a]/40 transition-opacity" onclick="UI.toggleMobileNav(false)"></div>
        <div class="absolute right-0 top-0 bottom-0 w-[82%] max-w-[340px] bg-white p-5 pt-[calc(1.2rem+env(safe-area-inset-top))] flex flex-col transform transition-transform translate-x-full duration-200 pb-safe border-l border-[#e6e6e6]" id="mobile-drawer-content">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-[#f0f0f0]">
                <h2 class="font-bold text-sm text-[#0a0a0a] flex items-center gap-2">
                    <i class="fas fa-th-large text-xs"></i> 題目快速導覽
                </h2>
                <div class="flex gap-2">
                    <button onclick="UI.toggleModal('history-modal', true); UI.toggleMobileNav(false)" class="w-8 h-8 rounded border border-[#d4d4d4] flex items-center justify-center text-[#525252] hover:text-[#0a0a0a] active:scale-95 transition-transform" title="歷史紀錄" aria-label="歷史紀錄">
                        <i class="fas fa-history text-xs"></i>
                    </button>
                    <button onclick="UI.toggleMobileNav(false)" class="w-8 h-8 rounded border border-[#d4d4d4] flex items-center justify-center text-[#525252] hover:text-[#0a0a0a] active:scale-95 transition-transform" title="關閉" aria-label="關閉導覽抽屜">
                        <i class="fas fa-times text-xs"></i>
                    </button>
                </div>
            </div>

            <!-- Drawer Progress -->
            <div class="bg-[#f4f6f8] rounded-md p-3 mb-3 border border-[#e6e6e6]">
                <div class="flex justify-between text-xs mb-1 font-semibold text-[#525252]">
                    <span>完成進度</span>
                    <span id="mobile-drawer-score" class="num font-bold text-[#0a0a0a]">0/0</span>
                </div>
                <div class="w-full bg-[#e6e6e6] h-1.5 rounded-full overflow-hidden">
                    <div id="mobile-drawer-progress" class="h-full bg-[#1d5fbf] w-0 transition-[width] duration-300"></div>
                </div>
            </div>

            <!-- Drawer Grid -->
            <div class="flex-1 overflow-y-auto custom-scroll -mr-1 pr-1">
                <div id="mobile-nav-grid" class="grid grid-cols-5 gap-1.5 pb-4"></div>
            </div>

            <!-- Font scale options -->
            <div class="mt-3 pt-2.5 border-t border-[#f0f0f0] flex justify-between items-center">
                <span class="text-xs font-semibold text-[#525252]">畫面字級縮放</span>
                <div class="flex gap-2">
                    <button onclick="UI.adjustFontSize('decrease')" class="w-8 h-8 rounded border border-[#d4d4d4] text-[#0a0a0a] flex items-center justify-center hover:bg-[#eeeeee] font-bold text-xs">A-</button>
                    <button onclick="UI.adjustFontSize('increase')" class="w-8 h-8 rounded border border-[#d4d4d4] text-[#0a0a0a] flex items-center justify-center hover:bg-[#eeeeee] font-bold text-xs">A+</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Exam Modal -->
    <div id="custom-exam-modal" class="modal-overlay fixed inset-0 z-[80] items-center justify-center bg-[#0a0a0a]/50 p-4" role="dialog" aria-modal="true" aria-labelledby="custom-exam-title">
        <div class="modal-panel bg-white w-full max-w-md rounded-lg overflow-hidden border border-[#e6e6e6] flex flex-col max-h-[85vh]">
            <div class="p-4 border-b border-[#f0f0f0] bg-[#f4f6f8]">
                <div class="flex justify-between items-start">
                    <div>
                        <h2 id="custom-exam-title" class="text-base font-bold text-[#0a0a0a] flex items-center gap-2">
                            自訂模擬試卷
                        </h2>
                        <p class="text-xs text-[#525252] mt-0.5">從歷年試卷題庫中自由組合成題</p>
                    </div>
                    <button onclick="UI.toggleModal('custom-exam-modal', false)" class="text-[#525252] hover:text-[#0a0a0a] p-1" aria-label="關閉自訂試卷">
                        <i class="fas fa-times text-base"></i>
                    </button>
                </div>
            </div>
            
            <div class="p-4 overflow-y-auto custom-scroll flex-1 space-y-4">
                <!-- Step 1: Select Years -->
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="text-xs font-bold text-[#0a0a0a]">1. 選擇來源年份</label>
                        <button onclick="UI.toggleAllCustomYears()" class="text-xs font-semibold text-[#1d5fbf] hover:underline">全選 / 取消</button>
                    </div>
                    <div id="custom-year-list" class="grid grid-cols-3 gap-1.5 max-h-40 overflow-y-auto custom-scroll p-1 border border-[#e6e6e6] rounded-md bg-[#f4f6f8]"></div>
                </div>

                <!-- Step 2: Question Count -->
                <div>
                    <label class="text-xs font-bold text-[#0a0a0a] mb-1.5 block">2. 題目數量</label>
                    <div class="flex items-center gap-4">
                        <input type="range" id="custom-count-range" min="10" max="60" step="5" value="40" class="flex-1 h-2 bg-[#e6e6e6] rounded-lg appearance-none cursor-pointer accent-[#141414]" oninput="document.getElementById('custom-count-display').innerText = this.value">
                        <span class="num font-bold text-sm text-[#0a0a0a] w-8 text-center" id="custom-count-display">40</span>
                    </div>
                </div>

                <!-- Step 3: Options -->
                <div>
                    <label class="text-xs font-bold text-[#0a0a0a] mb-1.5 block">3. 進階設定</label>
                    <div class="space-y-2">
                        <label class="flex items-center justify-between p-2.5 rounded-md bg-[#f4f6f8] border border-[#e6e6e6] cursor-pointer hover:bg-[#eeeeee] transition-colors">
                            <span class="text-xs font-semibold text-[#0a0a0a]">打亂題目次序</span>
                            <input type="checkbox" id="custom-shuffle-q" class="w-4 h-4 rounded text-[#141414] focus:ring-[#141414]" checked>
                        </label>
                        <label class="flex items-center justify-between p-2.5 rounded-md bg-[#f4f6f8] border border-[#e6e6e6] cursor-pointer hover:bg-[#eeeeee] transition-colors">
                            <span class="text-xs font-semibold text-[#0a0a0a]">打亂選項次序 (A/B/C/D)</span>
                            <input type="checkbox" id="custom-shuffle-o" class="w-4 h-4 rounded text-[#141414] focus:ring-[#141414]">
                        </label>
                    </div>
                </div>
            </div>

            <div class="p-3.5 border-t border-[#f0f0f0] bg-white z-10">
                <button onclick="App.submitCustomExamForm()" class="w-full bg-[#141414] hover:bg-[#262626] text-white py-2.5 rounded-md font-bold transition-colors text-xs">
                    生成試卷並開始測驗
                </button>
            </div>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="result-modal" class="modal-overlay fixed inset-0 z-[70] items-center justify-center bg-[#0a0a0a]/50 p-4" role="dialog" aria-modal="true" aria-labelledby="result-modal-title">
        <div class="modal-panel bg-white w-full max-w-sm rounded-lg overflow-hidden border border-[#e6e6e6]" id="result-content">
            <div class="bg-[#141414] p-4 text-white text-center">
                <h2 id="result-modal-title" class="text-base font-bold mb-0.5">測驗結束</h2>
                <p class="text-[#a3a3a3] text-xs font-medium tracking-wide">個人成績分析報告</p>
            </div>
            <div class="p-4">
                <div id="grade-card" class="bg-[#141414] text-white p-3.5 rounded-md mb-3 text-center border border-[#e6e6e6]">
                    <div class="flex justify-center items-center gap-1.5 mb-1 text-xs opacity-80 font-medium">
                        <i class="fas fa-award text-xs"></i>
                        <span>預測 DSE 等級 (卷一甲部)</span>
                    </div>
                    <div id="grade-level" class="text-2xl font-bold num mb-0.5">Level 5</div>
                    <div id="grade-desc" class="text-xs opacity-90 font-medium">正在分析成績...</div>
                </div>
                <div class="grid grid-cols-3 gap-2 mb-4">
                    <div class="bg-[#f4f6f8] p-2.5 rounded-md text-center border border-[#e6e6e6]">
                        <div class="text-[#0a0a0a] font-bold text-base num" id="modal-score">0</div>
                        <div class="text-xs text-[#525252] font-semibold">答對</div>
                    </div>
                    <div class="bg-[#ffedea] p-2.5 rounded-md text-center border border-[#ffc9c2]">
                        <div class="text-[#831c1e] font-bold text-base num" id="modal-wrong">0</div>
                        <div class="text-xs text-[#831c1e] font-semibold">答錯</div>
                    </div>
                    <div class="bg-[#dcfae5] p-2.5 rounded-md text-center border border-[#a8f0c2]">
                        <div class="text-[#04250e] font-bold text-base num" id="modal-accuracy">0%</div>
                        <div class="text-xs text-[#04250e] font-semibold">準確率</div>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="UI.toggleModal('result-modal', false)" class="flex-1 bg-white border border-[#d4d4d4] text-[#0a0a0a] py-2 rounded-md font-bold text-xs hover:bg-[#f4f6f8] transition-colors">
                        檢閱試卷
                    </button>
                    <button onclick="App.restartQuiz()" class="flex-1 bg-[#141414] hover:bg-[#262626] text-white py-2 rounded-md font-bold text-xs transition-colors">
                        重新測驗
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="modal-overlay fixed inset-0 z-[75] items-center justify-center bg-[#0a0a0a]/50 p-4" onclick="UI.toggleModal('history-modal', false)" role="dialog" aria-modal="true" aria-labelledby="history-modal-title">
        <div class="modal-panel bg-white w-full max-w-sm max-h-[70vh] flex flex-col rounded-lg border border-[#e6e6e6]" onclick="event.stopPropagation()">
            <div class="p-3.5 border-b border-[#f0f0f0] flex justify-between items-center">
                <h3 id="history-modal-title" class="font-bold text-sm text-[#0a0a0a] flex items-center gap-1.5">
                    <i class="fas fa-history text-xs text-[#0a0a0a]"></i> 歷史成績紀錄
                </h3>
                <button onclick="UI.toggleModal('history-modal', false)" class="text-[#525252] hover:text-[#0a0a0a] p-1" aria-label="關閉歷史紀錄">
                    <i class="fas fa-times text-sm"></i>
                </button>
            </div>
            <div class="overflow-y-auto p-3 custom-scroll flex-1" id="history-list"></div>
            <div class="p-3 border-t border-[#f0f0f0] grid grid-cols-2 gap-2 bg-[#f4f6f8]">
                <button onclick="App.exportUserData()" class="py-2 rounded-md bg-white border border-[#d4d4d4] text-xs font-semibold text-[#0a0a0a] hover:bg-[#eeeeee] transition-colors flex items-center justify-center">
                    <i class="fas fa-download mr-1.5 text-xs text-[#0a0a0a]"></i> 備份進度
                </button>
                <button onclick="document.getElementById('import-file').click()" class="py-2 rounded-md bg-white border border-[#d4d4d4] text-xs font-semibold text-[#0a0a0a] hover:bg-[#eeeeee] transition-colors flex items-center justify-center">
                    <i class="fas fa-upload mr-1.5 text-xs text-[#0a0a0a]"></i> 還原紀錄
                </button>
                <input type="file" id="import-file" class="hidden" accept=".json" onchange="App.importUserData(this)">
            </div>
        </div>
    </div>

    <!-- Image Lightbox Zoom Modal -->
    <div id="lightbox" class="fixed inset-0 z-[100] bg-black/90 hidden items-center justify-center p-3 sm:p-5 transition-opacity duration-150 opacity-0" onclick="UI.closeLightbox()">
        <img id="lightbox-img" src="" alt="放大圖片" class="max-w-full max-h-full object-contain rounded bg-white p-2">
        <button class="absolute top-3 right-4 text-white/80 hover:text-white text-3xl font-bold z-[101]" onclick="UI.closeLightbox()" aria-label="關閉放大">&times;</button>
        <p class="absolute bottom-4 text-white/70 text-xs font-medium tracking-wider pointer-events-none">點擊任意處關閉放大</p>
    </div>

    <!-- Desktop Floating Submit Button (Exam Mode) -->
    <button id="desktop-submit-btn" onclick="Quiz.submitExam()" class="hidden fixed bottom-8 right-8 z-30 bg-[#141414] hover:bg-[#262626] text-white w-12 h-12 rounded-lg items-center justify-center transition-colors focus:outline-none" title="交卷" aria-label="交卷">
        <i class="fas fa-check text-lg"></i>
    </button>

    <!-- Modular Scripts -->
    <script src="js/store.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
