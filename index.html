<!DOCTYPE html>
<html lang="zh-Hant" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- SEO & PWA -->
    <title>ICT 歷年MC試題庫</title>
    <meta name="description" content="最強 DSE ICT 歷年MC試題庫。支援即時練習、模擬考試與自訂組卷。">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <meta name="theme-color" content="#f8fafc">
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans TC', 'Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    colors: { 
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81'
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.04)'
                    }
                }
            }
        };
    </script>
    
    <!-- Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="css/app.css">
</head>

<body class="bg-slate-50 text-slate-800 transition-colors duration-200 min-h-screen flex flex-col pb-24 xl:pb-8 select-none">

    <!-- Header Navigation -->
    <nav class="absolute md:fixed top-0 inset-x-0 z-40 glass-nav transition-all duration-200 pt-[env(safe-area-inset-top)] h-[calc(4rem+env(safe-area-inset-top))]">
        <div class="max-w-[1450px] mx-auto px-4 sm:px-6 h-full flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer group" onclick="window.scrollTo({top:0, behavior:'smooth'})">
                <div class="w-9 h-9 bg-brand-600 rounded-lg flex items-center justify-center text-white shadow-md shadow-brand-500/20 group-hover:scale-105 transition-transform">
                    <i class="fas fa-graduation-cap text-sm"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight leading-none text-slate-900">ICT MC試題庫</h1>
                    <p id="greeting-text" class="text-[10px] text-brand-600 font-bold tracking-wider mt-0.5">早晨，準備好溫習了嗎？</p>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="flex flex-col items-end mr-1">
                    <span class="text-[10px] text-slate-400 font-bold tracking-wider">目前得分</span>
                    <div class="flex items-center gap-1.5">
                        <span id="header-score" class="font-mono font-bold text-brand-600 text-lg leading-none">0</span>
                        <span class="text-xs text-slate-400 font-bold">/ <span id="header-total">0</span></span>
                    </div>
                </div>
                <div class="h-6 w-px bg-slate-200"></div>
                <button onclick="UI.toggleModal('history-modal', true)" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition-colors" title="歷史紀錄">
                    <i class="fas fa-history text-xs"></i>
                </button>
            </div>
        </div>
        <div class="absolute bottom-0 left-0 w-full h-[2px] bg-slate-100">
            <div id="progress-bar" class="h-full bg-brand-600 transition-all duration-300 w-0"></div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-[1450px] mx-auto w-full px-4 sm:px-6 pt-[calc(5rem+env(safe-area-inset-top))] md:pt-[calc(5.5rem+env(safe-area-inset-top))] flex flex-col xl:flex-row gap-6">
        
        <!-- Desktop Sidebar -->
        <aside class="hidden xl:flex flex-col w-72 flex-shrink-0">
            <div class="sticky top-[calc(5.5rem+env(safe-area-inset-top))] space-y-4 max-h-[calc(100vh-7rem)] flex flex-col">
                <!-- Stats Card -->
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/90 flex-shrink-0">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs font-bold text-slate-400 tracking-wider">計時器</span>
                        <span id="timer-display" class="font-mono font-bold text-slate-700 bg-slate-100 px-2.5 py-0.5 rounded border border-slate-200 text-sm">00:00</span>
                    </div>
                    <div>
                        <div class="text-[10px] text-slate-400 font-bold mb-0.5">已作答進度</div>
                        <div class="flex items-baseline gap-1">
                            <span id="sidebar-score" class="text-2xl font-black text-slate-800 tracking-tight">0</span>
                            <span class="text-slate-400 font-bold text-xs">/ <span id="sidebar-total">0</span></span>
                        </div>
                    </div>
                    <div class="mt-3 pt-2.5 border-t border-slate-100 flex justify-between items-center">
                        <div class="flex items-center gap-1.5 text-[10px] text-emerald-600 font-semibold">
                            <i class="fas fa-check-circle"></i>
                            <span>題庫已就緒</span>
                        </div>
                        <button onclick="UI.toggleModal('history-modal', true)" class="text-[10px] font-bold text-brand-600 hover:underline transition-colors">
                            <i class="fas fa-history mr-1"></i>歷史紀錄
                        </button>
                    </div>
                </div>

                <!-- Navigation Card -->
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/90 flex-1 flex flex-col min-h-0">
                    <div class="flex justify-between items-center mb-3 flex-shrink-0">
                        <h3 class="text-xs font-bold text-slate-500 flex items-center gap-2"><i class="fas fa-map text-brand-600"></i> 題目快速導覽</h3>
                    </div>
                    <div class="overflow-y-auto custom-scroll pr-1 flex-1">
                        <div id="question-nav-grid" class="grid grid-cols-5 gap-1.5 pb-2"></div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Center Main Content -->
        <div class="flex-1 min-w-0">
            <!-- Filter & Mode Bar -->
            <div class="bg-white rounded-2xl p-3.5 sm:p-4 shadow-sm border border-slate-200/90 mb-5 relative z-30">
                <div class="grid grid-cols-1 md:grid-cols-12 gap-3 mb-3.5">
                    
                    <!-- Year / Paper Selection -->
                    <div class="md:col-span-4 flex flex-col gap-1">
                        <div class="flex justify-between items-baseline">
                            <label for="examyear" class="text-[11px] font-bold text-slate-500 tracking-wider ml-1">年份 / 試卷</label>
                            <button onclick="UI.toggleModal('custom-exam-modal', true)" class="text-[10px] font-bold text-brand-600 hover:underline transition-colors flex items-center gap-1">
                                <i class="fas fa-magic"></i> 自訂組卷
                            </button>
                        </div>
                        <div class="relative">
                            <select id="examyear" class="w-full pl-3 pr-9 py-2 rounded-xl border border-slate-200 bg-slate-50/70 text-sm font-bold focus:ring-2 focus:ring-brand-500 outline-none cursor-pointer text-slate-800 appearance-none shadow-sm"></select>
                            <i class="fas fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
                        </div>
                    </div>

                    <!-- Mode Selection -->
                    <div class="md:col-span-4 flex flex-col gap-1">
                        <label for="mode" class="text-[11px] font-bold text-slate-500 tracking-wider ml-1">練習模式</label>
                        <div class="relative">
                            <select id="mode" class="w-full pl-3 pr-9 py-2 rounded-xl border border-slate-200 bg-slate-50/70 text-sm font-bold focus:ring-2 focus:ring-brand-500 outline-none cursor-pointer text-slate-800 appearance-none shadow-sm">
                                <option value="practice">⚡ 練習模式 (即時對答案)</option>
                                <option value="exam">📝 考試模式 (模擬 DSE 計時)</option>
                                <option value="study">📖 溫習模式 (直接看答案)</option>
                            </select>
                            <i class="fas fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
                        </div>
                    </div>

                    <!-- Search Input -->
                    <div class="md:col-span-4 flex flex-col gap-1">
                        <label for="search-input" class="text-[11px] font-bold text-slate-500 tracking-wider ml-1">搜尋題號 / 關鍵字</label>
                        <div class="relative">
                            <input type="text" id="search-input" placeholder="輸入題號 (如 5、12)..." class="w-full pl-8 pr-3 py-2 rounded-xl border border-slate-200 bg-slate-50/70 text-sm font-bold focus:ring-2 focus:ring-brand-500 outline-none text-slate-800 placeholder-slate-400 shadow-sm">
                            <i class="fas fa-search absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        </div>
                        <div class="flex items-center justify-between text-[11px] text-slate-500 mt-1 px-0.5">
                            <span id="search-stats-text" class="font-medium text-slate-500"></span>
                            <label class="cursor-pointer inline-flex items-center gap-1 font-bold hover:text-brand-600 transition-colors">
                                <input type="checkbox" id="search-scope-all" class="w-3.5 h-3.5 rounded text-brand-600 focus:ring-brand-500 cursor-pointer" onchange="UI.toggleSearchScope(this.checked)">
                                <span id="search-scope-label">跨年份全庫搜尋 (835題)</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Segmented Control Tabs (Clear, clickable pill tabs with counters) -->
                <div class="bg-slate-100/90 p-1 rounded-xl border border-slate-200/90 flex gap-1 shadow-inner">
                    <button onclick="UI.setTab('all')" id="tab-all" class="flex-1 py-2 px-3 rounded-lg text-xs sm:text-sm font-bold transition-all text-center whitespace-nowrap bg-white text-brand-600 shadow-sm border border-slate-200/80 flex items-center justify-center gap-1.5">
                        <span>所有題目</span>
                        <span id="tab-count-all" class="text-[11px] font-mono px-1.5 py-0.2 bg-slate-100 text-slate-600 rounded-full">0</span>
                    </button>
                    <button onclick="UI.setTab('wrong')" id="tab-wrong" class="flex-1 py-2 px-3 rounded-lg text-xs sm:text-sm font-semibold transition-all text-center whitespace-nowrap text-slate-600 hover:text-slate-900 hover:bg-white/60 flex items-center justify-center gap-1.5">
                        <span>❌ 錯題重溫</span>
                        <span id="tab-count-wrong" class="text-[11px] font-mono px-1.5 py-0.2 bg-red-100 text-red-600 rounded-full font-bold">0</span>
                    </button>
                    <button onclick="UI.setTab('starred')" id="tab-starred" class="flex-1 py-2 px-3 rounded-lg text-xs sm:text-sm font-semibold transition-all text-center whitespace-nowrap text-slate-600 hover:text-slate-900 hover:bg-white/60 flex items-center justify-center gap-1.5">
                        <span>⭐ 星號收藏</span>
                        <span id="tab-count-starred" class="text-[11px] font-mono px-1.5 py-0.2 bg-amber-100 text-amber-700 rounded-full font-bold">0</span>
                    </button>
                </div>
            </div>

            <!-- Question Cards Container -->
            <div id="result" class="space-y-4 min-h-[50vh] select-auto">
                <!-- Skeleton Loader -->
                <div class="animate-pulse bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex justify-between mb-4">
                        <div class="h-5 bg-slate-200 rounded w-20"></div>
                        <div class="h-5 bg-slate-200 rounded w-8"></div>
                    </div>
                    <div class="h-28 bg-slate-100 rounded-xl w-4/5 mb-4"></div>
                    <div class="space-y-2">
                        <div class="h-12 bg-slate-100 rounded-xl w-full"></div>
                        <div class="h-12 bg-slate-100 rounded-xl w-full"></div>
                        <div class="h-12 bg-slate-100 rounded-xl w-full"></div>
                        <div class="h-12 bg-slate-100 rounded-xl w-full"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Mobile Bottom Navigation Bar (Enhanced shortcuts) -->
    <nav id="mobile-bottom-bar" class="xl:hidden fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-lg border-t border-slate-200 z-50 pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.06)]">
        <div class="flex items-center justify-around h-14 px-2">
            <button onclick="UI.toggleMobileNav(true)" class="flex flex-col items-center justify-center gap-0.5 w-16 h-full text-slate-600 active:scale-95 transition-transform touch-manipulation">
                <i class="fas fa-th-large text-base"></i>
                <span class="text-[10px] font-bold">題號導覽</span>
            </button>
            <button onclick="UI.setTab('wrong'); window.scrollTo({top:0, behavior:'smooth'})" class="flex flex-col items-center justify-center gap-0.5 w-16 h-full text-slate-600 active:scale-95 transition-transform touch-manipulation">
                <i class="fas fa-times-circle text-base text-red-500"></i>
                <span class="text-[10px] font-bold">錯題重溫</span>
            </button>
            <button onclick="UI.setTab('starred'); window.scrollTo({top:0, behavior:'smooth'})" class="flex flex-col items-center justify-center gap-0.5 w-16 h-full text-slate-600 active:scale-95 transition-transform touch-manipulation">
                <i class="fas fa-star text-base text-amber-400"></i>
                <span class="text-[10px] font-bold">星號收藏</span>
            </button>
            <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="flex flex-col items-center justify-center gap-0.5 w-16 h-full text-slate-600 active:scale-95 transition-transform touch-manipulation">
                <i class="fas fa-arrow-up text-base"></i>
                <span class="text-[10px] font-bold">頂部</span>
            </button>
            <button id="mobile-submit-btn" onclick="Quiz.submitExam()" class="hidden flex-col items-center justify-center gap-0.5 w-16 h-full text-brand-600 active:scale-95 transition-transform touch-manipulation font-bold">
                <i class="fas fa-check-circle text-lg"></i>
                <span class="text-[10px] font-bold">交卷</span>
            </button>
        </div>
    </nav>

    <!-- Mobile Drawer for Question Navigation -->
    <div id="mobile-nav-drawer" class="fixed inset-0 z-[60] hidden" aria-hidden="true">
        <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm transition-opacity" onclick="UI.toggleMobileNav(false)"></div>
        <div class="absolute right-0 top-0 bottom-0 w-[82%] max-w-[340px] bg-white shadow-2xl p-5 pt-[calc(1.2rem+env(safe-area-inset-top))] flex flex-col transform transition-transform translate-x-full duration-200 pb-safe border-l border-slate-200" id="mobile-drawer-content">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                <h2 class="font-bold text-base text-slate-900 flex items-center gap-2">
                    <i class="fas fa-map text-brand-600 text-sm"></i> 題目快速導覽
                </h2>
                <div class="flex gap-2">
                    <button onclick="UI.toggleModal('history-modal', true); UI.toggleMobileNav(false)" class="w-8 h-8 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-600 active:scale-90 transition-transform" title="歷史紀錄">
                        <i class="fas fa-history text-xs"></i>
                    </button>
                    <button onclick="UI.toggleMobileNav(false)" class="w-8 h-8 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-600 active:scale-90 transition-transform" title="關閉">
                        <i class="fas fa-times text-xs"></i>
                    </button>
                </div>
            </div>

            <!-- Drawer Progress -->
            <div class="bg-slate-50 rounded-xl p-3 mb-3 border border-slate-200/80">
                <div class="flex justify-between text-xs mb-1 font-bold text-slate-500">
                    <span>完成進度</span>
                    <span id="mobile-drawer-score" class="font-mono">0/0</span>
                </div>
                <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
                    <div id="mobile-drawer-progress" class="h-full bg-brand-600 w-0 transition-all duration-300"></div>
                </div>
            </div>

            <!-- Drawer Grid -->
            <div class="flex-1 overflow-y-auto custom-scroll -mr-1 pr-1">
                <div id="mobile-nav-grid" class="grid grid-cols-5 gap-1.5 pb-4"></div>
            </div>

            <!-- Font scale options -->
            <div class="mt-3 pt-2.5 border-t border-slate-200 flex justify-between items-center">
                <span class="text-xs font-bold text-slate-500">畫面字級縮放</span>
                <div class="flex gap-2">
                    <button onclick="UI.adjustFontSize('decrease')" class="w-8 h-8 rounded-lg bg-slate-100 border border-slate-200 text-slate-700 flex items-center justify-center hover:bg-slate-200 font-bold text-xs">A-</button>
                    <button onclick="UI.adjustFontSize('increase')" class="w-8 h-8 rounded-lg bg-slate-100 border border-slate-200 text-slate-700 flex items-center justify-center hover:bg-slate-200 font-bold text-xs">A+</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ✨ Custom Exam Modal -->
    <div id="custom-exam-modal" class="modal-overlay fixed inset-0 z-[80] items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4" role="dialog" aria-modal="true" aria-labelledby="custom-exam-title">
        <div class="modal-panel bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-slate-200 flex flex-col max-h-[85vh]">
            <div class="p-5 border-b border-slate-100 bg-slate-50/70">
                <div class="flex justify-between items-start">
                    <div>
                        <h2 id="custom-exam-title" class="text-lg font-bold text-slate-900 flex items-center gap-2">
                            <i class="fas fa-magic text-brand-600"></i> 自訂模擬試卷
                        </h2>
                        <p class="text-xs text-slate-500 mt-0.5">從歷年試卷題庫中自由組合成題</p>
                    </div>
                    <button onclick="UI.toggleModal('custom-exam-modal', false)" class="text-slate-400 hover:text-slate-600 p-1">
                        <i class="fas fa-times text-lg"></i>
                    </button>
                </div>
            </div>
            
            <div class="p-5 overflow-y-auto custom-scroll flex-1 space-y-5">
                <!-- Step 1: Select Years -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-bold text-slate-700">1. 選擇來源年份</label>
                        <button onclick="UI.toggleAllCustomYears()" class="text-xs font-bold text-brand-600 hover:underline">全選 / 取消</button>
                    </div>
                    <div id="custom-year-list" class="grid grid-cols-3 gap-1.5 max-h-44 overflow-y-auto custom-scroll p-1 border border-slate-200 rounded-xl bg-slate-50/50"></div>
                </div>

                <!-- Step 2: Question Count -->
                <div>
                    <label class="text-xs font-bold text-slate-700 mb-2 block">2. 題目數量</label>
                    <div class="flex items-center gap-4">
                        <input type="range" id="custom-count-range" min="10" max="60" step="5" value="40" class="flex-1 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-brand-600" oninput="document.getElementById('custom-count-display').innerText = this.value">
                        <span class="font-mono font-bold text-base text-brand-600 w-8 text-center" id="custom-count-display">40</span>
                    </div>
                </div>

                <!-- Step 3: Options -->
                <div>
                    <label class="text-xs font-bold text-slate-700 mb-2 block">3. 進階設定</label>
                    <div class="space-y-2">
                        <label class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-200 cursor-pointer hover:bg-slate-100 transition-colors">
                            <span class="text-xs font-bold text-slate-700">🔀 打亂題目次序</span>
                            <input type="checkbox" id="custom-shuffle-q" class="w-4 h-4 rounded text-brand-600 focus:ring-brand-500" checked>
                        </label>
                        <label class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-200 cursor-pointer hover:bg-slate-100 transition-colors">
                            <span class="text-xs font-bold text-slate-700">🔠 打亂選項次序 (A/B/C/D)</span>
                            <input type="checkbox" id="custom-shuffle-o" class="w-4 h-4 rounded text-brand-600 focus:ring-brand-500">
                        </label>
                    </div>
                </div>
            </div>

            <div class="p-4 border-t border-slate-100 bg-white z-10">
                <button onclick="App.submitCustomExamForm()" class="w-full bg-brand-600 hover:bg-brand-500 text-white py-3 rounded-xl font-bold shadow-md shadow-brand-500/25 active:scale-95 transition-all text-sm">
                    生成試卷並開始測驗
                </button>
            </div>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="result-modal" class="modal-overlay fixed inset-0 z-[70] items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4" role="dialog" aria-modal="true" aria-labelledby="result-modal-title">
        <div class="modal-panel bg-white w-full max-w-sm rounded-2xl shadow-xl overflow-hidden border border-slate-200" id="result-content">
            <div class="bg-gradient-to-br from-indigo-700 to-indigo-900 p-5 text-white text-center relative overflow-hidden">
                <h2 id="result-modal-title" class="text-lg font-bold mb-0.5 relative z-10">測驗結束</h2>
                <p class="text-indigo-200 text-[11px] font-bold tracking-widest relative z-10">個人成績分析報告</p>
            </div>
            <div class="p-5">
                <div id="grade-card" class="bg-gradient-to-r from-blue-600 to-indigo-600 p-4 rounded-xl mb-4 shadow text-center text-white">
                    <div class="flex justify-center items-center gap-1 mb-1 opacity-90">
                        <i class="fas fa-award text-xs"></i>
                        <span class="text-[11px] font-bold tracking-wider">預測 DSE 等級 (卷一甲部)</span>
                    </div>
                    <div id="grade-level" class="text-3xl font-black mb-0.5">Level 5</div>
                    <div id="grade-desc" class="text-xs font-bold opacity-95">正在分析成績...</div>
                </div>
                <div class="grid grid-cols-3 gap-2 mb-5">
                    <div class="bg-slate-50 p-2.5 rounded-xl text-center border border-slate-200">
                        <div class="text-slate-800 font-black text-lg" id="modal-score">0</div>
                        <div class="text-[10px] text-slate-500 font-bold">答對</div>
                    </div>
                    <div class="bg-red-50 p-2.5 rounded-xl text-center border border-red-100">
                        <div class="text-red-500 font-black text-lg" id="modal-wrong">0</div>
                        <div class="text-[10px] text-red-500 font-bold">答錯</div>
                    </div>
                    <div class="bg-emerald-50 p-2.5 rounded-xl text-center border border-emerald-100">
                        <div class="text-emerald-600 font-black text-lg" id="modal-accuracy">0%</div>
                        <div class="text-[10px] text-emerald-600 font-bold">準確率</div>
                    </div>
                </div>
                <div class="flex gap-2.5">
                    <button onclick="UI.toggleModal('result-modal', false)" class="flex-1 bg-slate-100 text-slate-700 py-2.5 rounded-xl font-bold text-xs hover:bg-slate-200 transition-colors active:scale-95">
                        檢閱試卷
                    </button>
                    <button onclick="App.restartQuiz()" class="flex-1 bg-brand-600 text-white py-2.5 rounded-xl font-bold text-xs hover:bg-brand-500 transition-colors shadow-md shadow-brand-500/25 active:scale-95">
                        重新測驗
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="modal-overlay fixed inset-0 z-[75] items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4" onclick="UI.toggleModal('history-modal', false)" role="dialog" aria-modal="true" aria-labelledby="history-modal-title">
        <div class="modal-panel bg-white w-full max-w-sm max-h-[70vh] flex flex-col rounded-2xl shadow-xl border border-slate-200" onclick="event.stopPropagation()">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                <h3 id="history-modal-title" class="font-bold text-sm text-slate-900 flex items-center gap-2">
                    <i class="fas fa-history text-brand-600"></i> 歷史成績紀錄
                </h3>
                <button onclick="UI.toggleModal('history-modal', false)" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="overflow-y-auto p-3.5 custom-scroll flex-1" id="history-list"></div>
            <div class="p-3 border-t border-slate-100 grid grid-cols-2 gap-2 bg-slate-50">
                <button onclick="App.exportUserData()" class="py-2 rounded-lg bg-white border border-slate-200 text-xs font-bold text-slate-600 hover:bg-slate-100 transition-colors shadow-sm flex items-center justify-center">
                    <i class="fas fa-download mr-1.5 text-brand-600"></i> 備份進度
                </button>
                <button onclick="document.getElementById('import-file').click()" class="py-2 rounded-lg bg-white border border-slate-200 text-xs font-bold text-slate-600 hover:bg-slate-100 transition-colors shadow-sm flex items-center justify-center">
                    <i class="fas fa-upload mr-1.5 text-emerald-600"></i> 還原紀錄
                </button>
                <input type="file" id="import-file" class="hidden" accept=".json" onchange="App.importUserData(this)">
            </div>
        </div>
    </div>

    <!-- Image Lightbox Zoom Modal -->
    <div id="lightbox" class="fixed inset-0 z-[100] bg-black/90 hidden items-center justify-center p-3 sm:p-5 transition-opacity duration-200 opacity-0" onclick="UI.closeLightbox()">
        <img id="lightbox-img" src="" alt="放大圖片" class="max-w-full max-h-full object-contain rounded shadow-2xl transform transition-transform duration-200 scale-95 bg-white p-2">
        <button class="absolute top-3 right-4 text-white/80 hover:text-white text-3xl font-bold z-[101]" onclick="UI.closeLightbox()" aria-label="關閉放大">&times;</button>
        <p class="absolute bottom-4 text-white/60 text-xs font-mono tracking-widest pointer-events-none">點擊任意處關閉放大</p>
    </div>

    <!-- Desktop Floating Submit Button (Exam Mode) -->
    <button id="desktop-submit-btn" onclick="Quiz.submitExam()" class="hidden fixed bottom-8 right-8 z-30 bg-brand-600 hover:bg-brand-500 text-white w-12 h-12 rounded-xl shadow-lg shadow-brand-500/40 items-center justify-center transition-all hover:scale-105 active:scale-95 group focus:ring-4 focus:ring-brand-300" title="交卷">
        <i class="fas fa-check text-lg"></i>
    </button>

    <!-- Modular Scripts -->
    <script src="js/store.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
